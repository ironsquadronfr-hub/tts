name: CI

on:
  push:
    branches: [main, loader]
  pull_request:
    branches: [main, loader]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - name: Install Dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Validate
        run: npm run validate

      - name: Compile
        run: npm run compile

      - name: Install Lua tools
        run: sudo apt-get update && sudo apt-get install -y lua5.4 lua-check

      - name: Lint Lua
        run: npm run lint:lua

      - name: Test Lua
        run: npm run test:lua && npm run test:los

  release:
    # Only main publishes the "latest" release; other branches are only checked.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    needs: build

    steps:
      - uses: actions/checkout@v2

      - name: Install Dependencies
        run: npm install

      - name: Compile
        run: npm run compile

      - uses: 'marvinpinto/action-automatic-releases@latest'
        with:
          repo_token: '${{ secrets.GITHUB_TOKEN }}'
          automatic_release_tag: 'latest'
          prerelease: true
          files: |
            LICENSE
            contrib/cards/*.json
            dist/StarWarsLegion.json
